<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>Christopher Lyod B. Mercado</title>
<meta name="description" content="Building digital experiences that solve real problems.">
<style>
html,body{margin:0;padding:0;background:#08080b;}

.nfc, .nfc *, .nfc *::before, .nfc *::after { box-sizing: border-box; }
.nfc {
  --radius: 18px;
  --accent1: #f97316;
  --accent2: #d946ef;
  --accent-grad: linear-gradient(135deg, #f97316 0%, #d946ef 100%);
  --glow1: rgba(249,115,22,.35);
  --glow2: rgba(217,70,239,.28);
  --nfc-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  position: relative;
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 76px 18px 48px;
  font-family: var(--nfc-font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
.nfc[data-theme="dark"] {
  --bg: #08080b;
  --surface: rgba(255,255,255,.045);
  --surface-2: rgba(255,255,255,.075);
  --text: #f4f4f5;
  --muted: #9a9aa4;
  --faint: #6a6a74;
  --border: rgba(255,255,255,.09);
  --border-strong: rgba(255,255,255,.16);
}
.nfc[data-theme="light"] {
  --bg: #f3f3f5;
  --surface: rgba(0,0,0,.028);
  --surface-2: rgba(0,0,0,.05);
  --text: #101014;
  --muted: #5b5b65;
  --faint: #97979f;
  --border: rgba(0,0,0,.09);
  --border-strong: rgba(0,0,0,.16);
}
.nfc::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(430px 330px at 16% 6%, var(--glow1), transparent 70%),
    radial-gradient(430px 330px at 88% 80%, var(--glow2), transparent 70%);
  opacity: .55;
  pointer-events: none;
  z-index: 0;
}
.nfc[data-has-bg="true"] {
  background-image: var(--bg-image);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.nfc[data-has-bg="true"]::before { display: none; }
.nfc[data-has-bg="true"][data-theme="dark"] {
  --surface: rgba(255,255,255,.10);
  --surface-2: rgba(255,255,255,.17);
  --border: rgba(255,255,255,.15);
  --border-strong: rgba(255,255,255,.24);
}
.nfc[data-has-bg="true"][data-theme="light"] {
  --surface: rgba(255,255,255,.64);
  --surface-2: rgba(255,255,255,.80);
  --border: rgba(0,0,0,.12);
  --border-strong: rgba(0,0,0,.2);
}
.nfc[data-has-bg="true"] .nfc-link,
.nfc[data-has-bg="true"] .nfc-action,
.nfc[data-has-bg="true"] .nfc-social,
.nfc[data-has-bg="true"] .nfc-qr,
.nfc[data-has-bg="true"] .nfc-iconbtn {
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.nfc[data-has-bg="true"]::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--bg-scrim);
  z-index: 0;
}
.nfc[data-font="rounded"] { --nfc-font: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif; }
.nfc[data-font="serif"]   { --nfc-font: Georgia, 'Times New Roman', serif; }
.nfc[data-font="mono"]    { --nfc-font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

.nfc-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.nfc-toolbar {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  display: flex;
  gap: 8px;
  z-index: 5;
}
.nfc-iconbtn {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  padding: 0;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: color .18s ease, border-color .18s ease, transform .18s ease;
}
.nfc-iconbtn:hover { color: var(--accent1); border-color: var(--border-strong); transform: translateY(-2px); }

.nfc-header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.nfc-headings { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.nfc-avatar {
  width: 116px; height: 116px; flex: none;
  padding: 3px; border-radius: 50%;
  background: var(--accent-grad);
  box-shadow: 0 14px 34px var(--glow1);
}
.nfc-avatar[data-shape="rounded"] { border-radius: 30px; }
.nfc-avatar[data-shape="square"]  { border-radius: 12px; }
.nfc-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit; background: var(--surface); }

.nfc-name { font-size: 25px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 0; }
.nfc-role { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.45; }
.nfc-dot { color: var(--faint); }
.nfc-company { color: var(--faint); }
.nfc-tagline { text-align: center; font-size: 13.5px; line-height: 1.6; color: var(--muted); margin: 0; }

.nfc-actions { display: flex; gap: 10px; justify-content: center; }
.nfc-action {
  flex: 1 1 0;
  max-width: 132px;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 14px 6px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.nfc-action svg { color: var(--accent1); }
.nfc-action span { font-size: 11px; font-weight: 600; color: var(--muted); }
.nfc-action:hover { background: var(--surface-2); transform: translateY(-2px); border-color: var(--border-strong); }

.nfc-primary {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; padding: 15px;
  border: none; border-radius: var(--radius);
  background: var(--accent-grad);
  color: #fff;
  font-family: inherit; font-size: 14.5px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 14px 34px var(--glow1);
  transition: transform .18s ease, box-shadow .18s ease;
}
.nfc-primary:hover { transform: translateY(-2px); box-shadow: 0 18px 42px var(--glow1); }
.nfc-primary:active { transform: translateY(0); }
.nfc-primary svg { color: #fff; }

.nfc-socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.nfc-social {
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  transition: transform .18s ease, color .18s ease, border-color .18s ease;
}
.nfc-social:hover { color: var(--accent1); border-color: var(--border-strong); transform: translateY(-2px); }

.nfc-links { display: flex; flex-direction: column; gap: 9px; }
.nfc-link {
  display: flex; align-items: center; gap: 13px;
  padding: 15px 16px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.nfc-link:hover { background: var(--surface-2); border-color: var(--border-strong); transform: translateY(-2px); }
.nfc-link-icon { display: flex; color: var(--accent1); }
.nfc-link-label { flex: 1; font-size: 14px; font-weight: 600; }
.nfc-link-arrow { display: flex; color: var(--faint); }

.nfc-qr {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
}
.nfc-qr-box { width: 170px; height: 170px; padding: 9px; background: #fff; border-radius: 12px; }
.nfc-qr-box svg { width: 100%; height: 100%; display: block; }
.nfc-qr-caption { font-size: 12px; color: var(--muted); margin: 0; text-align: center; }

.nfc-toast {
  position: fixed; left: 50%; bottom: 28px;
  transform: translateX(-50%) translateY(14px);
  background: var(--text); color: var(--bg);
  padding: 11px 20px; border-radius: 999px;
  font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 10; white-space: nowrap;
}
.nfc-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.nfc[data-layout="list"] .nfc-header { flex-direction: row; text-align: left; align-items: center; gap: 16px; }
.nfc[data-layout="list"] .nfc-headings { align-items: flex-start; }
.nfc[data-layout="list"] .nfc-avatar { width: 76px; height: 76px; }
.nfc[data-layout="list"] .nfc-name { font-size: 20px; }
.nfc[data-layout="list"] .nfc-tagline { text-align: left; }
.nfc[data-layout="list"] .nfc-socials { justify-content: flex-start; }

.nfc a:focus-visible, .nfc button:focus-visible { outline: 2px solid var(--accent1); outline-offset: 2px; }

.nfc.nfc-preview { min-height: 0; padding: 66px 16px 34px; }
.nfc.nfc-preview .nfc-toolbar { position: absolute; }
.nfc.nfc-preview .nfc-toast { position: absolute; bottom: 14px; }

@media (prefers-reduced-motion: reduce) { .nfc * { transition: none !important; } }

</style>
</head>

<script>
function QRLibFactory() {
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

.nfc, .nfc *, .nfc *::before, .nfc *::after { box-sizing: border-box; }
.nfc {

  --accent1: #f97316;
  --accent2: #d946ef;
  --accent-grad: linear-gradient(135deg, #f97316 0%, #d946ef 100%);
  --glow1: rgba(249,115,22,.35);

  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
.nfc[data-theme="dark"] {
  --bg: #08080b;
  --surface: rgba(255,255,255,.045);
  --surface-2: rgba(255,255,255,.075);
  --text: #f4f4f5;
  --muted: #9a9aa4;
  --faint: #6a6a74;
  --border: rgba(255,255,255,.09);
  --border-strong: rgba(255,255,255,.16);
}
.nfc[data-theme="light"] {
  --bg: #f3f3f5;
  --surface: rgba(0,0,0,.028);
  --surface-2: rgba(0,0,0,.05);
  --text: #101014;
  --muted: #5b5b65;
  --faint: #97979f;
  --border: rgba(0,0,0,.09);
  --border-strong: rgba(0,0,0,.16);
}
.nfc::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(430px 330px at 16% 6%, var(--glow1), transparent 70%),
    radial-gradient(430px 330px at 88% 80%, var(--glow2), transparent 70%);

  pointer-events: none;
  z-index: 0;
}
.nfc[data-has-bg="true"] {
  background-image: var(--bg-image);

  background-repeat: no-repeat;
}
.nfc[data-has-bg="true"]::before { display: none; }
.nfc[data-has-bg="true"][data-theme="dark"] {

  --border-strong: rgba(255,255,255,.24);
}
.nfc[data-has-bg="true"][data-theme="light"] {
  --surface: rgba(255,255,255,.64);
  --surface-2: rgba(255,255,255,.80);
  --border: rgba(0,0,0,.12);
  --border-strong: rgba(0,0,0,.2);
}
.nfc[data-has-bg="true"] .nfc-link,
.nfc[data-has-bg="true"] .nfc-action,
.nfc[data-has-bg="true"] .nfc-social,
.nfc[data-has-bg="true"] .nfc-qr,
.nfc[data-has-bg="true"] .nfc-iconbtn {
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.nfc[data-has-bg="true"]::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--bg-scrim);
  z-index: 0;
}
.nfc[data-font="rounded"] { --nfc-font: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif; }
.nfc[data-font="serif"]   { --nfc-font: Georgia, 'Times New Roman', serif; }
.nfc[data-font="mono"]    { --nfc-font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

.nfc-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.nfc-toolbar {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  display: flex;
  gap: 8px;
  z-index: 5;
}
.nfc-iconbtn {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  padding: 0;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: color .18s ease, border-color .18s ease, transform .18s ease;
}
.nfc-iconbtn:hover { color: var(--accent1); border-color: var(--border-strong); transform: translateY(-2px); }

.nfc-header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.nfc-headings { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.nfc-avatar {
  width: 116px; height: 116px; flex: none;
  padding: 3px; border-radius: 50%;
  background: var(--accent-grad);
  box-shadow: 0 14px 34px var(--glow1);
}
.nfc-avatar[data-shape="rounded"] { border-radius: 30px; }
.nfc-avatar[data-shape="square"]  { border-radius: 12px; }
.nfc-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit; background: var(--surface); }

.nfc-name { font-size: 25px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 0; }
.nfc-role { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.45; }
.nfc-dot { color: var(--faint); }
.nfc-company { color: var(--faint); }
.nfc-tagline { text-align: center; font-size: 13.5px; line-height: 1.6; color: var(--muted); margin: 0; }

.nfc-actions { display: flex; gap: 10px; justify-content: center; }
.nfc-action {
  flex: 1 1 0;
  max-width: 132px;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 14px 6px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.nfc-action svg { color: var(--accent1); }
.nfc-action span { font-size: 11px; font-weight: 600; color: var(--muted); }
.nfc-action:hover { background: var(--surface-2); transform: translateY(-2px); border-color: var(--border-strong); }

.nfc-primary {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; padding: 15px;
  border: none; border-radius: var(--radius);
  background: var(--accent-grad);
  color: #fff;
  font-family: inherit; font-size: 14.5px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 14px 34px var(--glow1);
  transition: transform .18s ease, box-shadow .18s ease;
}
.nfc-primary:hover { transform: translateY(-2px); box-shadow: 0 18px 42px var(--glow1); }
.nfc-primary:active { transform: translateY(0); }
.nfc-primary svg { color: #fff; }

.nfc-socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.nfc-social {
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  transition: transform .18s ease, color .18s ease, border-color .18s ease;
}
.nfc-social:hover { color: var(--accent1); border-color: var(--border-strong); transform: translateY(-2px); }

.nfc-links { display: flex; flex-direction: column; gap: 9px; }
.nfc-link {
  display: flex; align-items: center; gap: 13px;
  padding: 15px 16px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.nfc-link:hover { background: var(--surface-2); border-color: var(--border-strong); transform: translateY(-2px); }
.nfc-link-icon { display: flex; color: var(--accent1); }
.nfc-link-label { flex: 1; font-size: 14px; font-weight: 600; }
.nfc-link-arrow { display: flex; color: var(--faint); }

.nfc-qr {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
}
.nfc-qr-box { width: 170px; height: 170px; padding: 9px; background: #fff; border-radius: 12px; }
.nfc-qr-box svg { width: 100%; height: 100%; display: block; }
.nfc-qr-caption { font-size: 12px; color: var(--muted); margin: 0; text-align: center; }

.nfc-toast {
  position: fixed; left: 50%; bottom: 28px;
  transform: translateX(-50%) translateY(14px);
  background: var(--text); color: var(--bg);
  padding: 11px 20px; border-radius: 999px;
  font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 10; white-space: nowrap;
}
.nfc-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.nfc[data-layout="list"] .nfc-header { flex-direction: row; text-align: left; align-items: center; gap: 16px; }
.nfc[data-layout="list"] .nfc-headings { align-items: flex-start; }
.nfc[data-layout="list"] .nfc-avatar { width: 76px; height: 76px; }
.nfc[data-layout="list"] .nfc-name { font-size: 20px; }
.nfc[data-layout="list"] .nfc-tagline { text-align: left; }
.nfc[data-layout="list"] .nfc-socials { justify-content: flex-start; }

.nfc a:focus-visible, .nfc button:focus-visible { outline: 2px solid var(--accent1); outline-offset: 2px; }

.nfc.nfc-preview { min-height: 0; padding: 66px 16px 34px; }
.nfc.nfc-preview .nfc-toolbar { position: absolute; }
.nfc.nfc-preview .nfc-toast { position: absolute; bottom: 14px; }

@media (prefers-reduced-motion: reduce) { .nfc * { transition: none !important; } }

  var FILLED_VIEWBOX = { phone: '0 0 16 16', mail: '0 0 16 16' };

  var ICON_NAMES = (function () {
    var seen = {};
    return Object.keys(ICONS).concat(Object.keys(FILLED)).filter(function (k) {
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    }).sort();
  })();

  // ---- helpers -----------------------------------------------------------

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

  function slug(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function hexToRgba(hex, a) {
    var h = String(hex || '').replace('#', '').trim();
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return 'rgba(249,115,22,' + a + ')';
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function deepMerge(base, over) {
    var out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    if (!over) return out;
    Object.keys(over).forEach(function (k) {
      var bv = base ? base[k] : undefined;
      var ov = over[k];
      if (ov && typeof ov === 'object' && !Array.isArray(ov) &&
          bv && typeof bv === 'object' && !Array.isArray(bv)) {
        out[k] = deepMerge(bv, ov);
      } else if (ov !== undefined) {
        out[k] = ov;
      }
    });
    return out;
  }

  function prefersLight() {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  }
  function resolveTheme(mode) {
    if (mode === 'light' || mode === 'dark') return mode;
    return prefersLight() ? 'light' : 'dark';
  }
  function getVisitorTheme() {
    try { return localStorage.getItem(VISITOR_THEME_KEY); } catch (e) { return null; }
  }
  function setVisitorTheme(t) {
    try { localStorage.setItem(VISITOR_THEME_KEY, t); } catch (e) {}
  }

  function icon(name, size) {
    var fill = FILLED[name];
    if (fill) {
      return '<svg width="' + size + '" height="' + size + '" viewBox="' +
        (FILLED_VIEWBOX[name] || '0 0 24 24') + '" fill="currentColor" aria-hidden="true">' +
        fill + '</svg>';
    }
    var d = ICONS[name] || ICONS.link;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' +
      'aria-hidden="true">' + d + '</svg>';
  }

  // ---- config ------------------------------------------------------------

  function defaults() { return deepMerge({}, window.DEFAULT_CONFIG || {}); }

  function loadConfig() {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}
    return deepMerge(defaults(), stored || {});
  }
  function saveConfig(cfg) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); return true; }
    catch (e) { return false; }
  }
  function resetConfig() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    return defaults();
  }

  // ---- downloads / vcard / share ----------------------------------------

  function downloadFile(filename, text, type) {
    var blob = new Blob([text], { type: type || 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function vesc(s) {
    return String(s == null ? '' : s)
      .replace(/\\/g, '\\\\').replace(/\n/g, '\\n')
      .replace(/,/g, '\\,').replace(/;/g, '\\;');
  }

  function buildVCard(cfg) {
    var id = cfg.identity || {}, c = cfg.contact || {};
    var name = String(id.name || '').trim();
    var bits = name.split(/\s+/);
    var last = bits.length > 1 ? bits.pop() : '';
    var first = bits.join(' ');
    var lines = ['BEGIN:VCARD', 'VERSION:3.0'];
    lines.push('N:' + vesc(last) + ';' + vesc(first) + ';;;');
    lines.push('FN:' + vesc(name));
    if (id.company) lines.push('ORG:' + vesc(id.company));
    if (id.role) lines.push('TITLE:' + vesc(id.role));
    if (c.phone) lines.push('TEL;TYPE=CELL:' + vesc(c.phone));
    if (c.email) lines.push('EMAIL;TYPE=INTERNET:' + vesc(c.email));
    var site = (cfg.links || []).filter(function (l) { return l && l.url; })[0];
    if (site) lines.push('URL:' + vesc(site.url));
    if (id.tagline) lines.push('NOTE:' + vesc(id.tagline));
    lines.push('END:VCARD');
    return lines.join('\r\n');
  }

  function downloadVCard(cfg, notify) {
    var file = (slug((cfg.identity || {}).name) || 'contact') + '.vcf';
    downloadFile(file, buildVCard(cfg), 'text/vcard');
    if (notify) notify('Contact downloaded');
  }

  function shareCard(cfg, notify) {
    var id = cfg.identity || {};
    var url = location.href;
    var payload = { title: id.name || 'Contact', text: id.tagline || '', url: url };
    if (navigator.share) {
      navigator.share(payload).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(
        function () { if (notify) notify('Link copied'); },
        function () { if (notify) notify('Could not copy'); }
      );
    } else if (notify) {
      notify(url);
    }
  }

  // ---- render ------------------------------------------------------------

  function injectCSS() {
    if (document.getElementById(CSS_ID)) return;
    var s = document.createElement('style');
    s.id = CSS_ID;
    s.textContent = CARD_CSS;
    document.head.appendChild(s);
  }

  function render(container, cfg, opts) {
    opts = opts || {};
    injectCSS();

    var design = cfg.design || {};
    var feat = cfg.features || {};
    var id = cfg.identity || {};
    var ct = cfg.contact || {};

    var theme = opts.theme || getVisitorTheme() || resolveTheme(design.theme);
    var a1 = design.accent1 || '#f97316';
    var a2 = design.accent2 || '#d946ef';

    var root = document.createElement('div');
    root.className = 'nfc' + (opts.preview ? ' nfc-preview' : '');
    root.setAttribute('data-theme', theme);
    root.setAttribute('data-layout', design.layout || 'card');
    root.setAttribute('data-font', design.font || 'sans');
    root.style.setProperty('--radius', (design.radius == null ? 18 : design.radius) + 'px');
    root.style.setProperty('--accent1', a1);
    root.style.setProperty('--accent2', a2);
    root.style.setProperty('--accent-grad', 'linear-gradient(135deg,' + a1 + ' 0%,' + a2 + ' 100%)');
    root.style.setProperty('--glow1', hexToRgba(a1, 0.38));
    root.style.setProperty('--glow2', hexToRgba(a2, 0.30));

    var bgImage = design.background || '';
    if (bgImage) {
      var bgHex = theme === 'light' ? '#f3f3f5' : '#08080b';
      var dim = (design.backgroundDim == null ? 55 : design.backgroundDim) / 100;
      root.setAttribute('data-has-bg', 'true');
      root.style.setProperty('--bg-image', 'url("' + String(bgImage).replace(/"/g, '%22') + '")');
      root.style.setProperty('--bg-scrim', hexToRgba(bgHex, dim));
    }

    var html = '';

    var toolbar = '';
    if (feat.share) toolbar += '<button class="nfc-iconbtn" data-act="share" aria-label="Share this card">' + icon('share', 18) + '</button>';
    if (feat.themeToggle) toolbar += '<button class="nfc-iconbtn" data-act="theme" aria-label="Toggle light or dark theme">' + icon(theme === 'light' ? 'moon' : 'sun', 18) + '</button>';
    if (toolbar) html += '<div class="nfc-toolbar">' + toolbar + '</div>';

    html += '<div class="nfc-wrap">';

    html += '<header class="nfc-header">';
    html += '<div class="nfc-avatar" data-shape="' + escAttr(design.avatarShape || 'circle') + '">';
    html += '<img src="' + escAttr(id.avatar || PLACEHOLDER) + '" alt="' + escAttr(id.name || 'Profile photo') + '">';
    html += '</div>';
    html += '<div class="nfc-headings">';
    html += '<h1 class="nfc-name">' + esc(id.name || 'Your Name') + '</h1>';
    var roleLine = esc(id.role || '');
    if (id.company) {
      roleLine += (roleLine ? ' <span class="nfc-dot">&bull;</span> ' : '') +
        '<span class="nfc-company">' + esc(id.company) + '</span>';
    }
    if (roleLine) html += '<p class="nfc-role">' + roleLine + '</p>';
    html += '</div></header>';

    if (id.tagline) html += '<p class="nfc-tagline">' + esc(id.tagline) + '</p>';

    // Social icons come first, directly under the tagline and above the
    // Call / Email / WhatsApp buttons.
    if (feat.socials && cfg.socials && cfg.socials.length) {
      var socials = cfg.socials.filter(function (s) { return s && s.url; });
      if (socials.length) {
        html += '<div class="nfc-socials">';
        socials.forEach(function (s) {
          html += '<a class="nfc-social" href="' + escAttr(s.url) + '" target="_blank" rel="noopener" aria-label="' +
            escAttr(s.label || s.icon || 'Social link') + '">' + icon(s.icon || 'link', 18) + '</a>';
        });
        html += '</div>';
      }
    }

    if (feat.contact && (ct.phone || ct.email || ct.whatsapp)) {
      html += '<div class="nfc-actions">';
      if (ct.phone) html += '<a class="nfc-action" href="tel:' + escAttr(String(ct.phone).replace(/\s+/g, '')) + '">' + icon('phone', 20) + '<span>Call</span></a>';
      if (ct.email) html += '<a class="nfc-action" href="mailto:' + escAttr(ct.email) + '">' + icon('mail', 20) + '<span>Email</span></a>';
      if (ct.whatsapp) html += '<a class="nfc-action" href="https://wa.me/' + escAttr(String(ct.whatsapp).replace(/[^0-9]/g, '')) + '" target="_blank" rel="noopener">' + icon('whatsapp', 20) + '<span>WhatsApp</span></a>';
      html += '</div>';
    }

    if (feat.vcard) {
      html += '<button class="nfc-primary" data-act="vcard">' + icon('download', 18) + '<span>Save Contact</span></button>';
    }

    if (feat.links && cfg.links && cfg.links.length) {
      var links = cfg.links.filter(function (l) { return l && l.url; });
      if (links.length) {
        html += '<nav class="nfc-links">';
        links.forEach(function (l) {
          html += '<a class="nfc-link" href="' + escAttr(l.url) + '" target="_blank" rel="noopener">' +
            '<span class="nfc-link-icon">' + icon(l.icon || 'link', 18) + '</span>' +
            '<span class="nfc-link-label">' + esc(l.label || l.url) + '</span>' +
            '<span class="nfc-link-arrow">' + icon('chevron-right', 16) + '</span></a>';
        });
        html += '</nav>';
      }
    }

    if (feat.qr) {
      html += '<div class="nfc-qr">' +
        '<div class="nfc-qr-box" data-qr></div>' +
        '<p class="nfc-qr-caption">Scan to open this card on another phone</p>' +
        '</div>';
    }

    html += '</div>';
    html += '<div class="nfc-toast" data-toast role="status" aria-live="polite"></div>';

    root.innerHTML = html;
    container.innerHTML = '';
    container.appendChild(root);

    var toastEl = root.querySelector('[data-toast]');
    var toastTimer = null;
    function notify(msg) {
      if (!toastEl) return;
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
    }

    root.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-act');
        if (act === 'vcard') downloadVCard(cfg, notify);
        else if (act === 'share') shareCard(cfg, notify);
        else if (act === 'theme') {
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          setVisitorTheme(next);
          btn.innerHTML = icon(next === 'light' ? 'moon' : 'sun', 18);
        }
      });
    });

    var qrBox = root.querySelector('[data-qr]');
    if (qrBox && window.QRLib) {
      try {
        var qr = window.QRLib(0, 'M');
        qr.addData(location.href);
        qr.make();
        qrBox.innerHTML = qr.createSvgTag({ cellSize: 1, margin: 3, scalable: true, alt: 'QR code' });
      } catch (e) { qrBox.innerHTML = ''; }
    }

    return root;
  }

    injectCSS();
    return render(el, cfg || loadConfig(), {});

  // ---- export ------------------------------------------------------------

  function exportHTML(cfg) {
    var theme = resolveTheme((cfg.design || {}).theme);

    return '<!DOCTYPE html>\n' +
      '<html lang="en">\n<head>\n' +
      '<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">\n' +
      '<meta name="theme-color" content="' + bg + '">\n' +
      '<title>' + esc((cfg.identity || {}).name || 'NFC Card') + '</title>\n' +
      '<meta name="description" content="' + escAttr((cfg.identity || {}).tagline || '') + '">\n' +
